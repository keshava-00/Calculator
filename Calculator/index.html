<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculater</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="head" id="head">
        <h1 class="cal">Calculator</h1>
    </div>

    <div class="layout" id="layout">
        <div class="layoutChildes">
            <input type=" " id="resultInput">
        </div>
        <div class="layoutChildes" id="btnsBox">
            <div class="row">
                <buttons class="btns" id="btns">Ac</buttons>
                <buttons class="btns" id="btns">⌫</buttons>
                <buttons class="btns" id="btns">%</buttons>
                <buttons class="btns" id="btns">/</buttons>
            </div>

            <div class="row">
                <buttons class="btns" id="btns">7</buttons>
                <buttons class="btns" id="btns">8</buttons>
                <buttons class="btns" id="btns">9</buttons>
                <buttons class="btns" id="btns">*</buttons>
            </div>
            <div class="row">
                <buttons class="btns" id="btns">4</buttons>
                <buttons class="btns" id="btns">5</buttons>
                <buttons class="btns" id="btns">6</buttons>
                <buttons class="btns" id="btns">-</buttons>
            </div>
            <div class="row">
                <buttons class="btns" id="btns">1</buttons>
                <buttons class="btns" id="btns">2</buttons>
                <buttons class="btns" id="btns">3</buttons>
                <buttons class="btns" id="btns">+</buttons>
            </div>
            <div class="row">
                <buttons class="btns" id="btns">😉</buttons>
                <buttons class="btns" id="btns">0</buttons>
                <buttons class="btns" id="btns">.</buttons>
                <buttons class="btns" id="btns">=</buttons>
            </div>
        </div>
    </div>


</body>
<script src="script/script.js"></script>

</html>
